name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make release VERSION=${{ github.ref_name }}
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          size=$(du -h dist/aibox-pkg/bin/aibox | cut -f1)
          packaging/release/notes.sh "$TAG" "$size" > notes.md
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" $prerelease --title "AIBox $TAG" --notes-file notes.md \
            dist/aibox-$TAG-linux-arm64.tar.gz dist/aibox-$TAG-linux-arm64.yap dist/aibox-$TAG-linux-arm64 dist/SHA256SUMS
